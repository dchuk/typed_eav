name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  compatibility:
    name: Compatibility contract
    runs-on: ubuntu-latest
    outputs:
      ceiling_ruby: ${{ steps.contract.outputs.ceiling_ruby }}
    steps:
      - uses: actions/checkout@v4

      - name: Load compatibility contract
        id: contract
        run: |
          contract=".github/compatibility.json"
          echo "ceiling_ruby=$(jq -r '.lanes[] | select(.name == "ceiling") | .ruby' "$contract")" >> "$GITHUB_OUTPUT"

  release:
    name: Push gem to RubyGems
    needs: compatibility
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment:
      name: rubygems
      url: https://rubygems.org/gems/typed_eav

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.compatibility.outputs.ceiling_ruby }}
          bundler-cache: true

      - name: Verify tag matches gem version
        run: |
          gem_version="v$(ruby -r ./lib/typed_eav/version -e 'print TypedEAV::VERSION')"
          tag_version="${GITHUB_REF_NAME}"
          if [ "$gem_version" != "$tag_version" ]; then
            echo "Tag $tag_version does not match gem version $gem_version" >&2
            exit 1
          fi

      - name: Release gem (trusted publishing)
        uses: rubygems/release-gem@v1
