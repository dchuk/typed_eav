name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility contract
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
      tooling_ruby: ${{ steps.contract.outputs.tooling_ruby }}
      ceiling_ruby: ${{ steps.contract.outputs.ceiling_ruby }}
      ceiling_rails: ${{ steps.contract.outputs.ceiling_rails }}
      ceiling_postgresql: ${{ steps.contract.outputs.ceiling_postgresql }}
    steps:
      - uses: actions/checkout@v4

      - name: Load compatibility contract
        id: contract
        run: |
          contract=".github/compatibility.json"
          echo "matrix=$(jq -c '{include: .lanes}' "$contract")" >> "$GITHUB_OUTPUT"
          echo "tooling_ruby=$(jq -r '.tooling.ruby' "$contract")" >> "$GITHUB_OUTPUT"
          echo "ceiling_ruby=$(jq -r '.lanes[] | select(.name == "ceiling") | .ruby' "$contract")" >> "$GITHUB_OUTPUT"
          echo "ceiling_rails=$(jq -r '.lanes[] | select(.name == "ceiling") | .rails' "$contract")" >> "$GITHUB_OUTPUT"
          echo "ceiling_postgresql=$(jq -r '.lanes[] | select(.name == "ceiling") | .postgresql' "$contract")" >> "$GITHUB_OUTPUT"

  lint:
    name: RuboCop
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.compatibility.outputs.tooling_ruby }}
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --format github

  test:
    name: RSpec (${{ matrix.name }} — Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails_series }}, PostgreSQL ${{ matrix.postgresql }})
    needs: compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility.outputs.matrix) }}

    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      RAILS_VERSION: ${{ matrix.rails }}
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Configure dummy app database
        run: |
          cat > spec/dummy/config/database.yml <<'YAML'
          test:
            adapter: postgresql
            database: typed_eav_test
            host: <%= ENV.fetch("PGHOST", "localhost") %>
            username: <%= ENV.fetch("PGUSER", "postgres") %>
            password: <%= ENV.fetch("PGPASSWORD", "") %>
            encoding: unicode
          YAML

      - name: Create database and run migrations
        run: |
          bundle exec ruby -e '
            require_relative "spec/dummy/config/environment"
            config = ActiveRecord::Base.configurations.configs_for(env_name: "test").first
            ActiveRecord::Tasks::DatabaseTasks.create(config)
            ActiveRecord::Base.establish_connection(config)
            paths = [
              TypedEAV::Engine.root.join("db/migrate").to_s,
              Rails.root.join("db/migrate").to_s,
            ]
            ActiveRecord::MigrationContext.new(paths).migrate
          '

      - name: Run RSpec
        run: bundle exec rspec --format documentation

  consumer-install:
    name: Consumer migration installation
    needs: compatibility
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:${{ needs.compatibility.outputs.ceiling_postgresql }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_VERSION: ${{ needs.compatibility.outputs.ceiling_rails }}
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.compatibility.outputs.ceiling_ruby }}
          bundler-cache: true

      - name: Exercise packaged migrations in a consumer app
        run: bundle exec ruby script/consumer_install_smoke
